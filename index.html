<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignis | Expand Your Horizon</title>
    <meta name="description"
        content="Ignis is your premium knowledge expansion platform. Discover daily sparks of wisdom and deep-dive into the unknown.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
        rel="stylesheet">

    <!-- OpenGraph / Social Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Ignis | Expand Your Horizon">
    <meta property="og:description" content="Ignis is a modern personal knowledge expansion platform.">
    <meta property="og:image" content="https://raw.githubusercontent.com/dMiaoww/ignis/main/preview.png">

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
</head>

<body class="light-theme">
    <div id="app">
        <header class="navbar">
            <div class="logo">
                <span class="logo-icon">🌿</span>
                <h1>IGNIS</h1>
            </div>
            <nav class="nav-menu">
                <button id="nav-discovery" class="nav-btn active">Discovery</button>
                <button id="nav-recall" class="nav-btn">Recall</button>
            </nav>
            <div class="stats" id="stats-display">
                <button id="lang-toggle" class="lang-btn">EN / 中</button>
                <span class="stat-item"><span id="learned-count">0</span> Learned</span>
                <button id="settings-btn" class="icon-btn" aria-label="Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
            </div>
        </header>

        <main class="container">
            <section class="hero">
                <p id="hero-subtitle" class="subtitle">Scholarly Pursuits</p>
                <h2 id="hero-title" class="title-display">Your journey of <span class="accent-text">infinite
                        discovery</span>.</h2>
            </section>

            <div id="spark-grid" class="spark-grid">
                <!-- Sparks will be injected here by app.js -->
            </div>

            <div id="loading-trigger" class="loading-trigger hidden">
                <div class="spinner"></div>
                <p>Curating more knowledge...</p>
            </div>
        </main>

        <!-- Detail & AI Chat Modal Overlay -->
        <div id="detail-overlay" class="overlay hidden">
            <div class="modal shadow-soft">
                <button id="close-modal" class="btn-close" aria-label="Close dialogue">&times;</button>
                <div class="modal-layout">
                    <div id="modal-content" class="modal-info">
                        <!-- Content injected here -->
                    </div>
                    <div class="chat-section">
                        <h3>Discuss with AI</h3>
                        <div id="chat-messages" class="chat-messages">
                            <div class="msg ai">Hello! I'm here to dive deeper into this topic with you. What would you
                                like to explore?</div>
                        </div>
                        <div class="chat-input-area">
                            <input type="text" id="chat-input" placeholder="Ask a question..." autocomplete="off">
                            <button id="send-chat" class="btn-send">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="m22 2-7 20-4-9-9-4Z" />
                                    <path d="M22 2 11 13" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="mark-learned-btn" class="btn-primary">Mark as Learned</button>
                </div>
            </div>
        </div>
        <!-- Settings Modal Overlay -->
        <div id="settings-overlay" class="overlay hidden">
            <div class="modal shadow-soft" style="max-width: 500px; height: auto;">
                <button id="close-settings" class="btn-close">&times;</button>
                <div class="modal-info" style="border: none; padding: 40px;">
                    <h2 style="font-size: 1.8rem; margin-bottom: 20px;" id="settings-title">Cloud Sync</h2>
                    <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 25px;" id="settings-desc">
                        Keep your progress across devices using GitHub Gist.</p>

                    <div class="form-group">
                        <label for="github-token"
                            style="display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 8px;">GitHub
                            Token (PAT)</label>
                        <input type="password" id="github-token" class="text-input" placeholder="ghp_xxxxxxxxxxxx">
                    </div>

                    <div style="margin-top: 30px; display: flex; gap: 10px;">
                        <button id="save-settings" class="btn-primary" style="flex: 1;">Save & Sync</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="app.js"></script>
    </div>
</body>

</html>
