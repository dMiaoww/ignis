<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignis | Expand Your Horizon</title>
    <meta name="description"
        content="Ignis is your premium knowledge expansion platform. Discover daily sparks of wisdom and deep-dive into the unknown.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
        rel="stylesheet">
</head>

<body class="light-theme">
    <div id="app">
        <header class="navbar">
            <div class="logo">
                <span class="logo-icon">🌿</span>
                <h1>IGNIS</h1>
            </div>
            <div class="stats" id="stats-display">
                <span class="stat-item"><span id="learned-count">0</span> Learned</span>
            </div>
        </header>

        <main class="container">
            <section class="hero">
                <p class="subtitle">Scholarly Pursuits</p>
                <h2 class="title-display">Your journey of <span class="accent-text">infinite discovery</span>.</h2>
            </section>

            <div id="spark-grid" class="spark-grid">
                <!-- Sparks will be injected here by app.js -->
            </div>

            <div id="loading-trigger" class="loading-trigger hidden">
                <div class="spinner"></div>
                <p>Curating more knowledge...</p>
            </div>
        </main>

        <!-- Detail & AI Chat Modal Overlay -->
        <div id="detail-overlay" class="overlay hidden">
            <div class="modal shadow-soft">
                <button id="close-modal" class="btn-close" aria-label="Close dialogue">&times;</button>
                <div class="modal-layout">
                    <div id="modal-content" class="modal-info">
                        <!-- Content injected here -->
                    </div>
                    <div class="chat-section">
                        <h3>Discuss with AI</h3>
                        <div id="chat-messages" class="chat-messages">
                            <div class="msg ai">Hello! I'm here to dive deeper into this topic with you. What would you
                                like to explore?</div>
                        </div>
                        <div class="chat-input-area">
                            <input type="text" id="chat-input" placeholder="Ask a question..." autocomplete="off">
                            <button id="send-chat" class="btn-send">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="m22 2-7 20-4-9-9-4Z" />
                                    <path d="M22 2 11 13" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="mark-learned-btn" class="btn-primary">Mark as Learned</button>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
